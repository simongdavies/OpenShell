version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /bin
    - /lib
    - /lib64
    - /proc
    - /usr
    - /etc
    - /opt/demo/guest.py
    - /opt/demo/input
    - /opt/demo/run-demo.sh
    - /opt/hluk/python-shell.cpio
  read_write:
    - /dev/kvm
    - /dev/null
    - /dev/urandom
    - /opt/demo/output
    - /tmp

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  hyperlight_fixture:
    name: hyperlight-fixture
    endpoints:
      - host: @@FIXTURE_HOST@@
        port: @@ALLOWED_PORT@@
        protocol: rest
        enforcement: enforce
        access: full
        allowed_ips:
          - 10.0.0.0/8
          - 172.0.0.0/8
          - 192.168.0.0/16
          - fc00::/7
      - host: @@FIXTURE_HOST@@
        port: @@INNER_DENIED_PORT@@
        protocol: rest
        enforcement: enforce
        access: full
        allowed_ips:
          - 10.0.0.0/8
          - 172.0.0.0/8
          - 192.168.0.0/16
          - fc00::/7
    binaries:
      - path: /usr/local/bin/hluk
